name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install (hash-pinned)
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: ruff check .
      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clipmind/models
          key: models-${{ hashFiles('scripts/fetch_model.py') }}
      - name: Fetch pinned models (SHA-256 checked; the app itself has no network code)
        env:
          CLIPMIND_DATA_DIR: ${{ runner.temp }}/clipmind
        run: |
          python scripts/fetch_model.py potion-base-8M
          python scripts/fetch_model.py potion-retrieval-32M
      - name: Tests (sockets blocked)
        env:
          CLIPMIND_DATA_DIR: ${{ runner.temp }}/clipmind
        run: pytest -q
      - name: Cache eval sources (pinned commits, SHA-256 checked)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: eval/out/sources
          key: eval-sources-${{ hashFiles('eval/sources.py') }}
      - name: Filter eval (fails on regression vs eval/results/filters.json)
        run: python -W ignore eval/filters_eval.py --check
      - name: Search eval (fails on regression vs eval/results/search.json)
        env:
          CLIPMIND_DATA_DIR: ${{ runner.temp }}/clipmind
        run: python -W ignore eval/search_eval.py --check
      - name: Audit dependencies
        run: pip-audit --skip-editable
