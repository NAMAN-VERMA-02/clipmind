name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that clipmind makes hard?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Does this widen what clipmind stores, who can read it, or what it talks to? See THREAT_MODEL.md.
